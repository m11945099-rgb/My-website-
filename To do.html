<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Space+Grotesk:wght@400;600&display=swap"
        rel="stylesheet"
    >

    <!-- Your CSS -->
    <link rel="stylesheet" href="Todo-list.css">
</head>

<body>

    <main class="notebook">

        <!-- Header -->
        <header class="app-header">
            <span class="eyebrow">My daily notes</span>

            <h1>Todo List</h1>

            <p>Write it down. Get it done.</p>
        </header>


        <!-- Add Task -->
        <section class="composer">

            <div class="input-group">
                <input
                    type="text"
                    id="taskInput"
                    class="form-control"
                    placeholder="What needs to be done?"
                >

                <button
                    type="button"
                    id="addTaskBtn"
                    class="btn btn-ink"
                >
                    Add Task
                </button>
            </div>

        </section>


        <!-- Toolbar -->
        <div class="toolbar d-flex gap-2 mb-3">

            <button
                type="button"
                id="deleteFirstBtn"
                class="btn btn-outline-ink"
            >
                Delete First
            </button>

            <button
                type="button"
                id="deleteLastBtn"
                class="btn btn-outline-ink"
            >
                Delete Last
            </button>

            <button
                type="button"
                id="addBeginningBtn"
                class="btn btn-margin"
            >
                Add Beginning
            </button>

            <button
                type="button"
                id="clearAllBtn"
                class="btn btn-margin"
            >
                Clear All
            </button>

        </div>


        <!-- Status Message -->
        <div id="statusMessage">
            Start by adding a task.
        </div>


        <!-- Task Count -->
        <div class="mb-3">

            <span class="stat-pill">
                <span class="dot"></span>
                <span>
                    Total Tasks:
                    <span id="taskCount">0</span>
                </span>
            </span>

        </div>


        <!-- Task List -->
        <ul id="taskList">

            <li class="empty-state">

                <span class="doodle">
                    Nothing here yet...
                </span>

                Add your first task above.

            </li>

        </ul>


        <!-- Footer -->
        <footer class="credit">
            Stay organized • One task at a time
        </footer>

    </main>

</body>
</html>
